<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#4f46e5" />
<title>GMAT Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f7fb; --bg2:#eef0f6; --surface:#ffffff; --surface2:#f7f8fc;
    --ink:#1a1c2b; --muted:#5f6678; --faint:#9aa1b4; --line:#e8eaf1; --line2:#f0f2f7;
    --brand:#5b53e8; --brand2:#8b7bff; --brand-ink:#463fce; --accent:#0fb2c4;
    --pick:#eeeffe; --grad:linear-gradient(135deg,#6a5cf0 0%,#8b5cf6 100%);
    --grad-soft:linear-gradient(135deg,#eff0ff,#f4edff);
    --green:#15803d; --green-bg:#e9f7ee; --amber:#b45309; --amber-bg:#fdf3df;
    --red:#c81e36; --red-bg:#fdebee; --flag:#e0820a;
    --sans:'Inter','Inter var',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --r:18px; --r2:14px; color-scheme:light;
    --sh-sm:0 1px 2px rgba(20,24,50,.05);
    --sh:0 2px 6px rgba(20,24,50,.05),0 14px 34px rgba(20,24,50,.08);
    --sh-lg:0 8px 24px rgba(20,24,50,.10),0 30px 60px rgba(20,24,50,.12);
  }
  :root[data-theme="dark"]{
      color-scheme:dark;
      --bg:#0c0d15; --bg2:#11131e; --surface:#161826; --surface2:#1b1e2e;
      --ink:#eceef7; --muted:#98a0b4; --faint:#6b7386; --line:#242739; --line2:#1c1f2e;
      --brand:#8578ff; --brand2:#9d8cff; --brand-ink:#b6afff; --accent:#22c7db;
      --pick:#211f3d; --grad:linear-gradient(135deg,#7060ff,#9366ff);
      --grad-soft:linear-gradient(135deg,#1b1c3a,#241a39);
      --green:#4ade80; --green-bg:#102a1c; --amber:#fbbf24; --amber-bg:#2e2510;
      --red:#fb7185; --red-bg:#2c1620; --flag:#f5b945;
      --sh-sm:0 1px 2px rgba(0,0,0,.4);
      --sh:0 2px 8px rgba(0,0,0,.35),0 16px 40px rgba(0,0,0,.45);
      --sh-lg:0 10px 30px rgba(0,0,0,.5),0 40px 70px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box} html,body{margin:0;min-height:100%}
  body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-text-size-adjust:100%;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;letter-spacing:-.011em;
    padding-bottom:env(safe-area-inset-bottom);overflow-x:hidden}
  button{font-family:inherit;cursor:pointer} a{color:var(--brand-ink)}
  ::selection{background:color-mix(in srgb,var(--brand) 30%,transparent)}
  .hidden{display:none!important}

  /* screens + transitions */
  .screen{display:none}
  .screen.on{display:block;animation:rise .38s cubic-bezier(.2,.7,.2,1)}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .wrap{max-width:1000px;margin:0 auto;padding:22px 18px 64px}

  /* ===== APP BAR ===== */
  .appbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 82%,transparent);
    backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid var(--line);height:58px;
    display:flex;align-items:center;gap:12px;padding:0 16px}
  .appbar .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15.5px;letter-spacing:-.2px;cursor:pointer}
  .appbar .brand .mk{width:30px;height:30px;border-radius:9px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 4px 12px rgba(90,84,240,.4)}
  .appbar .back{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);
    color:var(--ink);border-radius:10px;padding:7px 12px;font-weight:700;font-size:13px;box-shadow:var(--sh-sm)}
  .appbar .sp{margin-left:auto}
  .themebtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;flex:0 0 auto;
    background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:10px;
    font-size:16px;line-height:1;box-shadow:var(--sh-sm);transition:border-color .15s,transform .15s}
  .themebtn:hover{border-color:var(--brand);transform:translateY(-1px)}
  .themebtn:active{transform:none}
  .themebtn .moon{display:none}
  :root[data-theme="dark"] .themebtn .sun{display:none}
  :root[data-theme="dark"] .themebtn .moon{display:inline}
  .gearbtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;flex:0 0 auto;
    background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:10px;font-size:17px;line-height:1;
    box-shadow:var(--sh-sm);transition:border-color .15s,transform .15s}
  .gearbtn:hover{border-color:var(--brand);transform:translateY(-1px)}
  .lp .top .themebtn{margin-left:auto}

  /* account / sync control */
  .acct{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .authbtn{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);
    color:var(--ink);border-radius:10px;padding:9px 14px;font-weight:700;font-size:13px;box-shadow:var(--sh-sm);
    transition:border-color .15s}
  .authbtn:hover{border-color:var(--brand)}
  .authbtn.ghost{background:transparent;box-shadow:none;color:var(--muted);padding:8px 11px;font-weight:600}
  .acct .who{display:inline-flex;align-items:center;gap:8px;max-width:220px}
  .acct .who img{width:26px;height:26px;border-radius:50%;flex:0 0 auto}
  .acct .who .em{font-size:13px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .acct .gicon{width:15px;height:15px;flex:0 0 auto}

  /* ===== LANDING ===== */
  #landing{min-height:100vh;
    background:radial-gradient(1100px 560px at 50% -8%,color-mix(in srgb,var(--brand) 26%,transparent),transparent 62%),var(--bg)}
  #landing.on{display:flex;flex-direction:column}
  .lp{max-width:1000px;margin:0 auto;width:100%;padding:26px 20px 60px;flex:1;display:flex;flex-direction:column}
  .lp .top{display:flex;align-items:center;gap:11px}
  .lp .top .mk{width:40px;height:40px;border-radius:12px;background:var(--grad);display:grid;place-items:center;color:#fff;font-weight:800;box-shadow:0 8px 20px rgba(90,84,240,.45)}
  .lp .top b{font-size:17px;letter-spacing:-.3px}
  .hero{flex:1;display:flex;flex-direction:column;justify-content:center;padding:40px 0 30px;max-width:680px}
  .hero .eyebrow{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:var(--surface);
    border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-weight:700;font-size:12.5px;color:var(--brand-ink);box-shadow:var(--sh-sm)}
  .hero .eyebrow .d{width:7px;height:7px;border-radius:50%;background:var(--accent)}
  .hero h1{font-size:clamp(32px,6vw,52px);line-height:1.04;letter-spacing:-1.5px;margin:18px 0 0;font-weight:850}
  .hero h1 .g{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .hero p.sub{font-size:clamp(15px,2.4vw,18px);color:var(--muted);max-width:560px;margin:16px 0 0;line-height:1.6}
  .cta-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
  .cta{border:0;border-radius:14px;padding:15px 26px;font:800 16px var(--sans);background:var(--grad);color:#fff;
    display:inline-flex;align-items:center;gap:9px;box-shadow:0 10px 26px rgba(90,84,240,.42);transition:transform .1s,box-shadow .2s}
  .cta:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(90,84,240,.5)}
  .cta.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--sh-sm)}
  .cta.ghost:hover{box-shadow:var(--sh)}
  .cta .gicon{width:19px;height:19px;background:#fff;border-radius:50%;padding:2px}
  .trust{display:flex;gap:18px;flex-wrap:wrap;margin-top:26px;color:var(--muted);font-size:13px}
  .trust span{display:inline-flex;align-items:center;gap:7px} .trust .ok{color:var(--green);font-weight:800}
  .resume{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;
    display:flex;align-items:center;gap:16px;box-shadow:var(--sh);max-width:460px}
  .resume .rr{display:flex;flex-direction:column} .resume .rr b{font-size:15px} .resume .rr small{color:var(--muted);font-size:12.5px}
  .resume .go{margin-left:auto;background:var(--grad);color:#fff;border:0;border-radius:11px;padding:11px 18px;font-weight:800;font-size:13.5px}
  .feats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
  @media (max-width:720px){ .feats{grid-template-columns:1fr} }
  .feat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--sh-sm)}
  .feat .fi{width:40px;height:40px;border-radius:11px;background:var(--grad-soft);color:var(--brand-ink);display:grid;place-items:center;margin-bottom:10px}
  .feat b{font-size:15px} .feat p{color:var(--muted);font-size:13px;margin:5px 0 0;line-height:1.5}
  .lp .legal{color:var(--faint);font-size:11.5px;text-align:center;margin-top:34px;line-height:1.6}

  /* ===== SPLASH + AUTH ===== */
  #landing{background:radial-gradient(1200px 620px at 50% -10%,color-mix(in srgb,var(--brand) 30%,transparent),transparent 60%),var(--bg)}
  #landing.on{display:block}
  /* Phase A — bare logo splash */
  .splash{position:fixed;inset:0;z-index:2;display:grid;place-items:center;cursor:pointer;
    transition:opacity .55s cubic-bezier(.2,.7,.2,1),transform .55s cubic-bezier(.2,.7,.2,1)}
  .splash.gone{opacity:0;transform:scale(1.06);pointer-events:none}
  .splash-inner{display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center;animation:rise .5s}
  .splash-logo{width:104px;height:104px;border-radius:30px;background:var(--grad);display:grid;place-items:center;
    color:#fff;font:850 46px var(--sans);box-shadow:0 22px 60px rgba(90,84,240,.5);position:relative}
  .splash-logo::after{content:"";position:absolute;inset:-10px;border-radius:38px;border:2px solid color-mix(in srgb,var(--brand) 40%,transparent);
    animation:pulse 2.2s ease-out infinite}
  @keyframes pulse{0%{transform:scale(1);opacity:.7}70%{transform:scale(1.25);opacity:0}100%{opacity:0}}
  .splash-word{font:850 30px var(--sans);letter-spacing:-.6px}
  .splash-word span{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .splash-hint{color:var(--faint);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:8px;animation:hintpulse 1.8s ease-in-out infinite}
  .splash-hint .ch{font-size:16px}
  @keyframes hintpulse{0%,100%{opacity:.5}50%{opacity:1}}
  /* Phase B — auth panel */
  .authstage{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;padding:40px 20px;overflow-y:auto;opacity:0;transform:translateY(14px);pointer-events:none;
    transition:opacity .5s .1s cubic-bezier(.2,.7,.2,1),transform .5s .1s cubic-bezier(.2,.7,.2,1)}
  .authstage.show{opacity:1;transform:none;pointer-events:auto}
  .authcard{width:100%;max-width:390px;background:var(--surface);border:1px solid var(--line);border-radius:22px;
    box-shadow:var(--sh-lg);padding:30px 26px 26px;position:relative}
  .authcard .themebtn{position:absolute;top:16px;right:16px}
  .ac-logo{width:52px;height:52px;border-radius:15px;background:var(--grad);display:grid;place-items:center;color:#fff;
    font:850 24px var(--sans);box-shadow:0 10px 24px rgba(90,84,240,.45);margin-bottom:16px}
  .ac-title{margin:0;font-size:23px;letter-spacing:-.4px}
  .ac-sub{margin:6px 0 20px;color:var(--muted);font-size:13.5px;line-height:1.5}
  .ac-tabs{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin-bottom:18px}
  .ac-tabs button{flex:1;border:0;background:transparent;color:var(--muted);border-radius:9px;padding:10px;font:800 13.5px var(--sans)}
  .ac-tabs button.on{background:var(--surface);color:var(--brand-ink);box-shadow:var(--sh-sm)}
  #authForm{display:flex;flex-direction:column;gap:11px}
  .authfield{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;
    font:500 15px var(--sans);color:var(--ink);outline:none;transition:border-color .15s,background .15s}
  .authfield:focus{border-color:var(--brand);background:var(--surface)}
  .authfield::placeholder{color:var(--faint)}
  .authprimary{width:100%;background:var(--grad);color:#fff;border:0;border-radius:12px;padding:14px;font:800 15.5px var(--sans);
    box-shadow:0 8px 20px rgba(90,84,240,.36);margin-top:3px;transition:transform .1s,box-shadow .2s}
  .authprimary:hover{transform:translateY(-1px)} .authprimary:disabled{opacity:.6;box-shadow:none;transform:none}
  .ac-msg{font-size:12.5px;line-height:1.5;margin-top:12px;min-height:0}
  .ac-msg.err{color:var(--red)} .ac-msg.ok{color:var(--green)}
  .ac-or{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:12px;font-weight:700;margin:18px 0}
  .ac-or::before,.ac-or::after{content:"";flex:1;height:1px;background:var(--line)}
  .authgoogle,.authguest{width:100%;border-radius:12px;padding:12px;font:700 14px var(--sans);border:1px solid var(--line);
    background:var(--surface);color:var(--ink);box-shadow:var(--sh-sm);display:flex;align-items:center;justify-content:center;gap:9px;transition:border-color .15s}
  .authgoogle:hover,.authguest:hover{border-color:var(--brand)}
  .authgoogle{margin-bottom:9px} .authgoogle .gicon{width:18px;height:18px}
  .authguest{background:transparent;box-shadow:none;color:var(--muted);font-weight:600}
  .authstage .legal{color:var(--faint);font-size:11.5px;text-align:center;line-height:1.6;max-width:390px}

  /* ===== SECTION HEADERS ===== */
  .pagehead{margin:6px 2px 18px}
  .pagehead .kick{color:var(--brand-ink);font-weight:800;font-size:12.5px;letter-spacing:.4px;text-transform:uppercase}
  .pagehead h2{margin:4px 0 0;font-size:26px;letter-spacing:-.5px}
  .pagehead p{margin:6px 0 0;color:var(--muted);font-size:13.5px}
  h3.sec{font-size:12.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--faint);margin:26px 2px 12px;font-weight:800}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}

  /* ===== DASHBOARD HERO ===== */
  .dhero{background:var(--grad);color:#fff;border-radius:22px;padding:22px;box-shadow:var(--sh-lg);
    display:flex;gap:22px;align-items:center;flex-wrap:wrap;position:relative;overflow:hidden}
  .dhero::after{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;
    background:rgba(255,255,255,.12);filter:blur(8px)}
  .dhero .ringbox{display:flex;align-items:center;gap:16px;z-index:1}
  .dhero .pc{font:850 30px/1 var(--sans);letter-spacing:-1px} .dhero .subt{opacity:.9;font-size:12.5px;margin-top:4px}
  .dhero .quick{display:flex;gap:22px;margin-left:auto;flex-wrap:wrap;z-index:1}
  .dhero .q .n{font:850 24px/1 var(--sans)} .dhero .q .l{opacity:.82;font-size:11px;margin-top:5px;letter-spacing:.4px;text-transform:uppercase}

  /* section / mode cards */
  .modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px}
  .mode{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;text-align:left;
    box-shadow:var(--sh-sm);display:flex;flex-direction:column;gap:7px;transition:transform .1s,box-shadow .2s,border-color .2s;position:relative;overflow:hidden}
  .mode:hover{transform:translateY(-3px);box-shadow:var(--sh);border-color:color-mix(in srgb,var(--brand) 40%,var(--line))}
  .mode .ic{width:44px;height:44px;border-radius:12px;background:var(--grad-soft);color:var(--brand-ink);display:grid;place-items:center;margin-bottom:3px}
  .mode .t{font-weight:800;font-size:15.5px} .mode .d{color:var(--muted);font-size:12.5px;line-height:1.45}
  .mode .badge{align-self:flex-start;margin-top:6px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;
    padding:3px 10px;font-size:11px;font-weight:800;color:var(--muted)}
  .mode.feature .ic{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(90,84,240,.4)}
  .mode[disabled]{opacity:.55;cursor:not-allowed;transform:none}
  .mode[disabled]:hover{box-shadow:var(--sh-sm);border-color:var(--line)}

  /* subchapter picker — widget cards */
  .topicgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:12px}
  .topic{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);
    border-radius:15px;padding:15px 16px;box-shadow:var(--sh-sm);transition:transform .12s,box-shadow .2s,border-color .2s}
  .topic:hover{transform:translateY(-2px);box-shadow:var(--sh);border-color:color-mix(in srgb,var(--brand) 42%,var(--line))}
  .topic .tk{width:36px;height:36px;border-radius:11px;background:var(--grad-soft);color:var(--brand-ink);
    display:grid;place-items:center;flex:0 0 auto}
  .topic .tn{font-weight:700;font-size:14px;line-height:1.32}
  .topic .tgo{margin-left:auto;color:var(--faint);font-size:17px;flex:0 0 auto;transition:color .15s,transform .15s}
  .topic:hover .tgo{color:var(--brand);transform:translateX(2px)}

  /* dashboard section cards */
  .scards{display:grid;grid-template-columns:1fr;gap:14px}
  @media (min-width:820px){ .scards{grid-template-columns:1fr 1fr} }
  .scard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
  .scard .sc-h{display:flex;align-items:center;gap:11px;margin-bottom:12px}
  .scard .sc-ic{width:36px;height:36px;border-radius:10px;background:var(--grad-soft);color:var(--brand-ink);display:grid;place-items:center;flex:0 0 auto}
  .scard .sc-h b{font-size:16px}
  .scard .sc-pct{margin-left:auto;font:850 22px var(--sans);background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .sc-stats{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin-bottom:10px}
  .sc-stats b{color:var(--ink)} .sc-stats .good b{color:var(--green)} .sc-stats .bad b{color:var(--red)}
  .precbar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--line2);margin-bottom:14px}
  .precbar i{display:block;height:100%} .precbar .ok{background:var(--green)} .precbar .no{background:var(--red)}
  .bd-lbl{font:800 10.5px var(--sans);letter-spacing:.5px;text-transform:uppercase;color:var(--faint);margin:14px 0 6px}
  .barrow{display:flex;align-items:center;gap:10px;margin:9px 0}
  .barrow .nm{width:150px;font-size:12.5px;font-weight:600;flex:0 0 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .barrow .tr{flex:1;height:9px;border-radius:6px;background:var(--line2);overflow:hidden}
  .barrow .tr i{display:block;height:100%;border-radius:6px;width:0;transition:width .6s cubic-bezier(.2,.7,.2,1)}
  .barrow .vv{width:52px;text-align:right;font:600 12px var(--mono);color:var(--muted);flex:0 0 auto}
  .nodata{color:var(--muted);font-size:13px;padding:14px 0;text-align:center}
  .callout{background:var(--grad-soft);border:1px solid var(--line);border-radius:13px;padding:13px 15px;margin-top:14px;font-size:13.5px}
  .toolrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
  .tbtn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-weight:700;font-size:13px;color:var(--ink);box-shadow:var(--sh-sm)}
  .tbtn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
  .foot{color:var(--faint);font-size:11.5px;text-align:center;margin-top:30px;line-height:1.7}

  /* settings */
  .setrow{display:flex;align-items:center;gap:14px}
  .setrow .hint2{color:var(--muted);font-size:12.5px;margin-top:2px}
  .card .hint{color:var(--muted);font-size:12.5px;margin:0 0 4px}
  .seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}

<script>
/* =================================================================== */
/* Three source books, loaded together and merged into one pool. Each question
   is tagged with its bank; the UI never shows a book picker — sections decide
   which questions appear. Add a 4th book here and it flows into its section. */
const BANKS=[
  ["og","questions-og.json","GMAT Official Guide 2024–25"],
  ["manhattan","questions.json","Manhattan: All the Verbal"],
  ["quant","questions-quant.json","MR Quant Question Bank"],
];
const isQuantType=t=>t==="PS"||t==="DS";
/* concept (subchapter) key: quant classifies by topic (chapter); verbal by the
   book's subtype label, falling back to chapter for banks with no subtype. */
const conceptOf=q=>isQuantType(q.type)?q.chapter:(q.subtype||q.chapter);
const DIFFS=["Easy","Medium","Hard"];
const MIN_ATTEMPTS=3;

const TLABEL={RC:"Reading Comprehension",CR:"Critical Reasoning",PS:"Problem Solving",DS:"Data Sufficiency"};
const ICON={
  verbal:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5a2 2 0 0 1 2-2h6v18H6a2 2 0 0 1-2-2Z"/><path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"/><path d="M8 7h1M8 11h1"/></svg>',
  quant:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h3M8 15h3M15 11v6"/></svg>',
  ds:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="M2 16l10 5 10-5M2 12l10 5 10-5"/></svg>',
  random:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>',
  dash:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 15l3-4 3 3 4-6"/></svg>',
  exam:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>',
  full:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',

  redo:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>',
};

/* ===== STORE (localStorage, Supabase-ready) ===== */
const Store=(()=>{
  const KEY="gmat_verbal_v1";
  let data=load();
  function blank(){ return {version:1, history:{}, daily:{date:null,level:"Easy",streak:0,lastPct:null,recent:[]}, adaptive:{level:"Easy"}}; }
  function load(){ try{ const d=JSON.parse(localStorage.getItem(KEY)); return d&&d.history?d:blank(); }catch(e){ return blank(); } }
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(data)); }catch(e){}
    try{ if(window.Sync) window.Sync.onLocalChange(data); }catch(e){} }
  function record(q,picked,correct){
    const h=data.history[q.id]||(data.history[q.id]={n:q.number,type:q.type,subtype:q.subtype||null,chapter:q.chapter||null,difficulty:q.difficulty||null,attempts:0,correct:0,lastResult:null,lastSeen:0});
    h.attempts++; if(correct)h.correct++; h.lastResult=correct?"correct":"wrong"; h.lastSeen=Date.now();
    h.subtype=q.subtype||h.subtype; h.chapter=q.chapter||h.chapter; h.difficulty=q.difficulty||h.difficulty; h.type=q.type; save();
  }
  function overall(){ let seen=0,corr=0; for(const h of Object.values(data.history)){ seen++; if(h.lastResult==="correct")corr++; } return {seen,corr,pct:seen?Math.round(100*corr/seen):null}; }
  function byField(field,type){ const a={}; for(const h of Object.values(data.history)){ if(type&&h.type!==type)continue; const k=h[field]; if(!k)continue; const x=a[k]||(a[k]={c:0,t:0}); x.t++; if(h.lastResult==="correct")x.c++; } return a; }
  return {
    get data(){return data;}, record, save,
    wrongIds(){ return Object.entries(data.history).filter(([,h])=>h.lastResult==="wrong").map(([id])=>id); },
    overall, byField,
    exportJSON(){return JSON.stringify(data,null,2);},
    importJSON(s){ const d=JSON.parse(s); if(!d.history)throw 0; data=d; save(); },
    reset(){ data=blank(); save(); },
    /* hydrate from a synced object WITHOUT re-triggering a push (avoids a sync loop) */
    hydrate(obj){ if(!obj||!obj.history)return; data=obj; try{ localStorage.setItem(KEY,JSON.stringify(data)); }catch(e){} },
  };
})();

/* ===== SYNC (optional Supabase backend; app is local-only if not configured) ===== */
/* Pure merge of two progress blobs — keeps the most progress from each, order-independent. */
function mergeProgress(local,remote){
  const blank={version:1,history:{},daily:{date:null,level:"Easy",streak:0,lastPct:null,recent:[]},adaptive:{level:"Easy"}};
  const L={...blank,...(local||{})}, R={...blank,...(remote||{})};
  const lh=L.history||{}, rh=R.history||{};
  const hist={};
  for(const id of new Set([...Object.keys(lh),...Object.keys(rh)])){
    const a=lh[id], b=rh[id];
    if(!a){ hist[id]=b; continue; } if(!b){ hist[id]=a; continue; }
    const newer=(b.lastSeen||0)>(a.lastSeen||0)?b:a;
    hist[id]={ ...a, ...b,
      n:a.n!=null?a.n:b.n,
      type:newer.type||a.type||b.type,
      subtype:newer.subtype!=null?newer.subtype:(a.subtype!=null?a.subtype:b.subtype),
      difficulty:newer.difficulty!=null?newer.difficulty:(a.difficulty!=null?a.difficulty:b.difficulty),
      attempts:Math.max(a.attempts||0,b.attempts||0),
      correct:Math.max(a.correct||0,b.correct||0),
      lastSeen:Math.max(a.lastSeen||0,b.lastSeen||0),
      lastResult:newer.lastResult };
  }
  const lastActive=o=>Object.values(o.history||{}).reduce((m,h)=>Math.max(m,h.lastSeen||0),0);
  const lAct=lastActive(L), rAct=lastActive(R);
  const ld=L.daily||blank.daily, rd=R.daily||blank.daily;
  const dCmp=(ld.date||"").localeCompare(rd.date||"");
  const base=dCmp>=0?ld:rd, other=dCmp>=0?rd:ld;
  const daily={ date:base.date, level:base.level, lastPct:base.lastPct,
    streak:Math.max(ld.streak||0,rd.streak||0),
    recent:[...new Set([...(base.recent||[]),...(other.recent||[])])].slice(0,6) };
  const adaptive={ level:((rAct>lAct?R.adaptive:L.adaptive)||blank.adaptive).level||"Easy" };
  return { version:1, history:hist, daily, adaptive };
}

const GICON='<svg class="gicon" viewBox="0 0 48 48" aria-hidden="true"><path fill="#4285F4" d="M45 24c0-1.6-.1-3.1-.4-4.6H24v9.1h11.8c-.5 2.8-2 5.1-4.4 6.7v5.6h7.1C42.7 37 45 31 45 24z"/><path fill="#34A853" d="M24 46c5.9 0 10.9-2 14.5-5.3l-7.1-5.6c-2 1.3-4.5 2.1-7.4 2.1-5.7 0-10.5-3.8-12.2-9H4.5v5.7C8.1 41.1 15.4 46 24 46z"/><path fill="#FBBC05" d="M11.8 28.2c-.4-1.3-.7-2.7-.7-4.2s.2-2.9.7-4.2v-5.7H4.5C3 17.1 2 20.4 2 24s1 6.9 2.5 9.9l7.3-5.7z"/><path fill="#EA4335" d="M24 10.7c3.2 0 6.1 1.1 8.4 3.3l6.3-6.3C34.9 4.1 29.9 2 24 2 15.4 2 8.1 6.9 4.5 14.1l7.3 5.7c1.7-5.2 6.5-9.1 12.2-9.1z"/></svg>';

const Sync=(()=>{
  let sb=null, user=null, pushT=null, lastPushed="";
  const TABLE="progress";
  function client(){
    if(sb) return sb;
    if(!window.SUPABASE_URL||!window.SUPABASE_ANON_KEY||!window.supabase) return null;
    sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY,
      {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    return sb;
  }
  const enabled=()=>!!client();
  async function init(){
    const c=client(); if(!c){ renderAuth(); return; }
    try{
      const { data:{ session } }=await c.auth.getSession(); user=session?.user||null;
      c.auth.onAuthStateChange((_e,sess)=>{ const prev=user; user=sess?.user||null; renderAuth();
        if(user&&(!prev||prev.id!==user.id)) pull(); });
    }catch(e){}
    renderAuth();
    if(user) pull();
    /* already signed in (e.g. returning after a Google redirect): skip the splash */
    if(user && document.getElementById("landing")?.classList.contains("on")){ try{ renderHome(); }catch(e){} }
  }
  async function pull(){
    const c=client(); if(!c||!user) return;
    try{
      const { data, error }=await c.from(TABLE).select("data").eq("user_id",user.id).maybeSingle();
      if(error) throw error;
      const merged=mergeProgress(Store.data, data&&data.data);
      Store.hydrate(merged); lastPushed=JSON.stringify(merged);
      rerenderCurrent();
      await upsert(merged);
    }catch(e){ }
  }
  async function upsert(obj){
    const c=client(); if(!c||!user) return;
    const { error }=await c.from(TABLE).upsert({user_id:user.id,data:obj,updated_at:new Date().toISOString()});
    if(error) throw error; lastPushed=JSON.stringify(obj);
  }
  function onLocalChange(data){
    if(!enabled()||!user) return;
    clearTimeout(pushT);
    pushT=setTimeout(async()=>{
      try{
        const c=client();
        const { data:row }=await c.from(TABLE).select("data").eq("user_id",user.id).maybeSingle();
        const merged=mergeProgress(data, row&&row.data);
        if(JSON.stringify(merged)===lastPushed) return;
        await upsert(merged);
      }catch(e){ }
    },1500);
  }
  async function signIn(){
    const c=client();
    if(!c){ alert("Sync isn't set up yet.\nAdd your Supabase URL + anon key near the top of index.html."); return; }
    await c.auth.signInWithOAuth({ provider:"google", options:{ redirectTo:location.origin+location.pathname } });
  }
  /* email + password — returns {ok, session, msg}. Never throws. */
  async function signInEmail(email,password){
    const c=client(); if(!c) return {ok:false,msg:"Cloud sign-in isn't configured on this build."};
    try{ const {data,error}=await c.auth.signInWithPassword({email,password});
      if(error) return {ok:false,msg:error.message};
      return {ok:true,session:data.session}; }catch(e){ return {ok:false,msg:"Network error — check your connection."}; }
  }
  async function signUpEmail(email,password){
    const c=client(); if(!c) return {ok:false,msg:"Cloud sign-up isn't configured on this build."};
    try{ const {data,error}=await c.auth.signUp({email,password});
      if(error) return {ok:false,msg:error.message};
      /* if email confirmation is on, no session comes back until the link is clicked */
      if(data.session) return {ok:true,session:data.session};
      return {ok:true,session:null,msg:"Account created — check your email to confirm, then sign in."}; }
    catch(e){ return {ok:false,msg:"Network error — check your connection."}; }
  }
  async function signOut(){ const c=client(); if(c){ try{ await c.auth.signOut(); }catch(e){} } user=null; renderAuth(); }
  function renderAuth(){
    const acct=document.getElementById("acct");
    if(acct){
      if(!enabled()){ acct.innerHTML='<span style="color:var(--muted);font-size:13px">Cloud sync isn\'t configured — progress is stored on this device only.</span>'; }
      else if(user){ const em=user.email||"Account";
        const av=user.user_metadata&&(user.user_metadata.avatar_url||user.user_metadata.picture);
        acct.innerHTML=`<span class="who" title="${esc(em)}">${av?`<img src="${esc(av)}" alt="" referrerpolicy="no-referrer">`:""}<span class="em">${esc(em)}</span></span><button class="authbtn ghost" id="signOutBtn" type="button">Sign out</button>`;
        const so=document.getElementById("signOutBtn"); if(so) so.onclick=signOut;
      } else {
        acct.innerHTML=`<button class="authbtn" id="signInBtn" type="button">${GICON} Sign in with Google</button>`;
        const si=document.getElementById("signInBtn"); if(si) si.onclick=signIn;
      }
    }
  }
  return { init, onLocalChange, signIn, signInEmail, signUpEmail, signOut, enabled, renderAuth, get user(){return user;} };
})();
window.Sync=Sync;

/* ===== ATTEMPTS (per-question rows in Supabase; anonymous-auth device identity) ===== */
const Attempts=(()=>{
  const DEVICE_KEY="gmat_device_id";
  let sb=null, deviceId=null, ready=false;
  function client(){
    if(sb) return sb;
    if(!window.SUPABASE_URL||!window.SUPABASE_ANON_KEY||!window.supabase) return null;
    sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY,{
      auth:{persistSession:true,autoRefreshToken:true,storageKey:"gmat_attempts_auth",detectSessionInUrl:false}});
    return sb;
  }
  async function init(){
    const c=client(); if(!c) return;
    try{
      const {data:{session}}=await c.auth.getSession();
      if(session?.user){ deviceId=session.user.id; ready=true; }
      else{
        const {data,error}=await c.auth.signInAnonymously();
        if(!error&&data?.user){ deviceId=data.user.id; ready=true; }
        else{ console.warn("[Attempts] anon sign-in failed.",error?.message); }
      }
      if(ready) localStorage.setItem(DEVICE_KEY,deviceId);
    }catch(e){ console.warn("[Attempts] init error:",e); }
  }
  function optIdx(q,label){ if(!q?.options||label==null) return null; const i=q.options.findIndex(o=>o.label===label); return i>=0?i:null; }
  async function saveAttempt(q,chosenLabel,timeMs){
    const c=client(); if(!c||!ready||!deviceId) return;
    const ki=optIdx(q,q.correct_answer); if(ki===null) return;
    const row={ user_id:deviceId, question_id:q.id, source:q.bank||"mixed", q_type:q.type,
      chosen_index:optIdx(q,chosenLabel), correct_index:ki, is_correct:chosenLabel===q.correct_answer,
      time_ms:(typeof timeMs==="number"&&timeMs>=0)?Math.round(timeMs):null };
    try{ const {error}=await c.from("attempts").insert(row); if(error) console.warn("[Attempts] insert failed:",error.message); }catch(e){}
  }
  return {init,saveAttempt,get deviceId(){return deviceId;}};
})();

/* ===== APP STATE ===== */
const App={ all:[], mode:null, timed:false,
  qs:[], idx:0, answers:{}, flags:new Set(), checked:new Set(),
  timer:null, elapsed:0, showTimer:false, _repExpl:false, _sessMeta:null, _pool:[], _setCfg:null,
  qTimes:{}, _qTimedSet:new Set(), _timingLastIdx:-1, _qStart:0 };
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const mmss=s=>{s=Math.max(0,s|0);return String(s/60|0).padStart(2,"0")+":"+String(s%60).padStart(2,"0");};

/* ===== POOLS ===== */
const playable=q=>q.format!=="open_ended"&&q.options&&q.options.length&&q.correct_answer;
const byTypes=types=>App.all.filter(q=>types.includes(q.type)&&playable(q));
const byType=t=>byTypes([t]);
const wrongOfTypes=types=>{ const w=new Set(Store.wrongIds()); return byTypes(types).filter(q=>w.has(q.id)); };
function topicsFor(type){ const c={}; for(const q of byType(type)){ const k=conceptOf(q); if(!k)continue; c[k]=(c[k]||0)+1; }
  return Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([v,n])=>({v,n,label:`${v} (${n})`})); }

/* ===== SCREENS + NAV ===== */
const SCREENS=["landing","home","menu","setup","run","report","dash","settings"];
function show(id){
  SCREENS.forEach(s=>$("#"+s).classList.toggle("on",s===id));
  $("#appbar").classList.toggle("hidden", id==="landing"||id==="run");
  $("#backBtn").classList.toggle("hidden", !["menu","setup","dash","settings"].includes(id));
  window.scrollTo(0,0);
}
let stack=[];
function navTo(fn){ stack.push(fn); fn(); }
function navBack(){ stack.pop(); const top=stack[stack.length-1]; (top||renderHome)(); }

/* ===== LOADING (all banks merged) ===== */
async function loadAll(){
  if(App.all.length) return true;
  try{
    const parts=await Promise.all(BANKS.map(async ([bank,file])=>{
      const r=await fetch(file,{cache:"no-cache"}); if(!r.ok) throw 0;
      const arr=await r.json(); arr.forEach(q=>{q.bank=bank;}); return arr;
    }));
    App.all=parts.flat(); return true;
  }catch(e){ alert("Couldn't load the question banks.\nServe the folder: python -m http.server 8000"); return false; }
}

/* ===== LANDING (splash -> auth) ===== */
let _landingRevealed=false, _authTab="signin";
function renderLanding(){
  _landingRevealed=false;
  $("#splash").classList.remove("gone");
  $("#authStage").classList.remove("show");
  $("#landingLegal").textContent="Personal, fair-use study tool · 910 questions across 3 books (Verbal + Quant) · progress saved on this device unless you sign in.";
  $("#authGoogle").innerHTML=GICON+" Continue with Google";
  const ov=Store.overall();
  $("#acSub").textContent=ov.seen
    ? `Welcome back — ${ov.pct}% over ${ov.seen} questions. Sign in to sync, or keep going as a guest.`
    : "Sign in to sync your progress across devices — or continue as a guest.";
  setAuthTab("signin");
  $("#acMsg").textContent=""; $("#acMsg").className="ac-msg";
  show("landing");
}
function revealAuth(){
  if(_landingRevealed||!$("#landing").classList.contains("on")) return;
  _landingRevealed=true;
  $("#splash").classList.add("gone");
  $("#authStage").classList.add("show");
}
function setAuthTab(t){
  _authTab=t;
  $("#acTabs").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  $("#acTitle").textContent=t==="register"?"Create account":"Welcome back";
  $("#authSubmit").textContent=t==="register"?"Create account →":"Sign in →";
  $("#authPass").setAttribute("autocomplete",t==="register"?"new-password":"current-password");
  $("#acMsg").textContent=""; $("#acMsg").className="ac-msg";
}
async function submitAuth(e){
  e.preventDefault();
  const email=$("#authEmail").value.trim(), pass=$("#authPass").value;
  const msg=$("#acMsg"), btn=$("#authSubmit");
  if(!email||pass.length<6){ msg.className="ac-msg err"; msg.textContent="Enter an email and a password of at least 6 characters."; return; }
  if(!(window.Sync&&Sync.enabled())){ msg.className="ac-msg err"; msg.textContent="Cloud accounts aren't configured on this build — use “Continue as guest” for now."; return; }
  btn.disabled=true; msg.className="ac-msg"; msg.textContent=_authTab==="register"?"Creating your account…":"Signing you in…";
  const r=_authTab==="register"?await Sync.signUpEmail(email,pass):await Sync.signInEmail(email,pass);
  btn.disabled=false;
  if(!r.ok){ msg.className="ac-msg err"; msg.textContent=r.msg||"That didn't work — please try again."; return; }
  if(r.session){ renderHome(); return; }               // signed in
  msg.className="ac-msg ok"; msg.textContent=r.msg||"Check your email to confirm your account, then sign in.";
  if(_authTab==="register") setTimeout(()=>setAuthTab("signin"),400);
}

/* weakest concept across everything answered (>= MIN_ATTEMPTS tries) */
function weakestConcept(){
  let best=null;
  for(const field of ["subtype","chapter"]){
    const agg=Store.byField(field);
    for(const [name,a] of Object.entries(agg)){ if(a.t<MIN_ATTEMPTS)continue; const p=a.c/a.t; if(!best||p<best.p)best={name,a,p}; }
  }
  return best;
}
/* AI status: the vector index runs in the browser, so it's "ready" once the
   precomputed embeddings have loaded (no server involved). */
async function pingAI(){
  const pill=$("#aiPill"); if(!pill) return;
  pill.className="ai-pill"; pill.innerHTML='<span class="dot"></span> loading…';
  const ok=await loadEmbeddings();
  if(ok){ pill.className="ai-pill on"; pill.innerHTML=`<span class="dot"></span> AI ready · ${EMB.size} indexed`; }
  else { pill.className="ai-pill off"; pill.innerHTML='<span class="dot"></span> index unavailable'; }
}

/* ===== RUNNER ===== */
function resetRun(){ App.idx=0; App.answers={}; App.flags=new Set(); App.checked=new Set();
  App.qTimes={}; App._qTimedSet=new Set(); App._timingLastIdx=-1; App._qStart=Date.now(); }
function startRun(){
  clearInterval(App.timer); App.elapsed=0; App.showTimer=App.timed;
  $("#timer").classList.toggle("hidden",!App.timed); tick();
  App.timer=setInterval(()=>{ App.elapsed++; tick(); },1000);
  show("run"); renderQ();
}
function tick(){ if(!App.showTimer)return; $("#timer").textContent=mmss(App.elapsed); }
function renderQ(){
  const q=App.qs[App.idx], n=App.qs.length, answered=App.checked.has(App.idx);
  if(App._timingLastIdx!==App.idx){ App._qStart=Date.now(); App._timingLastIdx=App.idx; }
  $("#qof").textContent=`${App.idx+1} / ${n}`;
  $("#prog").style.width=`${App.idx/n*100}%`;
  const typeCls=(q.type==='PS'||q.type==='DS')?`t-${q.type}`:'';
  $("#tags").innerHTML=`<span class="pill ${typeCls}">${q.type}</span>`+
    `<span class="pill ${answered?'':'hide'}">${esc(conceptOf(q)||'—')}</span>`+
    `<span class="pill d-${q.difficulty||''} ${answered&&q.difficulty?'':'hide'}">${esc(q.difficulty||'')}</span>`;
  $("#flagBtn").classList.toggle("on",App.flags.has(App.idx));
  $("#runMeta").textContent=(App.timed?"Timed practice":"Untimed practice")+(App._sessMeta?` · ${App._sessMeta.title}`:"");
  const parts=String(q.question).split("\n\n");
  const titled=parts.length>1&&parts[0].length<60&&!/[.?]$/.test(parts[0]);
  const qhtml=titled?`<b>${esc(parts[0])}</b><br>${esc(parts.slice(1).join("\n\n"))}`:esc(q.question);
  const diagHtml=q.diagram?`<img class="q-diagram" src="${q.diagram}" alt="figure">`:``;
  const dir=q.type==="RC"?"The questions refer to the passage. Select the best answer."
    :q.type==="DS"?"Decide whether the statements give enough information. Select the best answer."
    :"Select the best answer of the choices given.";
  const sel=App.answers[q.id], reveal=answered;
  const choices=(q.options||[]).map(o=>{ let cls="choice",mk="";
    if(reveal){ if(o.label===q.correct_answer){cls+=" correct";mk='<span class="mk">Correct</span>';} else if(o.label===sel){cls+=" wrong";mk='<span class="mk">Your pick</span>';} }
    else if(o.label===sel)cls+=" sel";
    return `<li class="${cls}" data-label="${o.label}"><span class="radio"></span><span class="ctext">${esc(o.text)}</span>${mk}</li>`; }).join("");
  let fb="";
  if(reveal){ const ok=sel===q.correct_answer, t=App.qTimes[App.idx];
    fb=`<div class="fb ${ok?'ok':'no'}"><div class="fh">${ok?'✓ Correct':(sel?'✗ Incorrect — answer is '+q.correct_answer:'Answer is '+q.correct_answer)}
      <span class="typetag"><span class="pill qtime">⏱ ${t!=null?mmss(t):'—'} on this question</span><span class="pill">${esc(conceptOf(q)||q.type)}</span>${q.difficulty?`<span class="pill d-${q.difficulty}">${esc(q.difficulty)}</span>`:''}</span></div>
      <div class="body"><h5>Explanation</h5>${esc(q.explanation||'No explanation available.')}</div></div>`; }
  const qpane=`<div class="pcard"><div class="directions">${esc(dir)}</div><div class="lbl">Question<span class="ln"></span></div>
    ${diagHtml}<p class="qtext">${qhtml}</p><ul class="choices">${choices}</ul>${fb}</div><div id="simPanelSlot"></div>`;
  const col=$("#splitcols");
  if(q.passage){ col.className="splitcols has-psg";
    col.innerHTML=`<div class="pcard psg sticky"><div class="lbl">Reading passage<span class="ln"></span></div><div class="passage">${esc(q.passage)}</div></div>`+qpane; }
  else { col.className="splitcols"; col.innerHTML=qpane; }
  col.querySelectorAll(".choice").forEach(li=>li.addEventListener("click",()=>pick(li.dataset.label)));
  updateAct();
  if(window.renderMathInElement) renderMathInElement(col,{delimiters:[{left:'$',right:'$',display:false}],throwOnError:false});
}
function pick(label){ const q=App.qs[App.idx]; if(App.checked.has(App.idx))return;
  App.answers[q.id]=label; $("#splitcols").querySelectorAll(".choice").forEach(li=>li.classList.toggle("sel",li.dataset.label===label)); updateAct(); }
function updateAct(){ const q=App.qs[App.idx], last=App.idx===App.qs.length-1, b=$("#actBtn");
  $("#prevBtn").disabled=App.idx===0;
  if(!App.checked.has(App.idx)){ b.textContent="Submit"; b.className="btn primary"; b.disabled=!App.answers[q.id]; }
  else { b.disabled=false; b.textContent=last?"Finish ✓":"Next ▶"; b.className="btn primary"+(last?" end":""); } }
$("#actBtn").addEventListener("click",()=>{ const q=App.qs[App.idx], last=App.idx===App.qs.length-1;
  if(!App.checked.has(App.idx)){
    const tMs=Date.now()-App._qStart;
    if(!App._qTimedSet.has(App.idx)){ App.qTimes[App.idx]=Math.round(tMs/1000); App._qTimedSet.add(App.idx); }
    App.checked.add(App.idx);
    Store.record(q,App.answers[q.id],App.answers[q.id]===q.correct_answer);
    Attempts.saveAttempt(q,App.answers[q.id],tMs);
    renderQ(); showSimilarForCurrentQ(); return; }
  if(last){ finish(); return; }
  App.idx++; renderQ(); });
$("#prevBtn").addEventListener("click",()=>{ if(App.idx>0){ App.idx--; renderQ(); } });
$("#flagBtn").addEventListener("click",()=>{ App.flags.has(App.idx)?App.flags.delete(App.idx):App.flags.add(App.idx); renderQ(); });
$("#quitBtn").addEventListener("click",()=>{ if(confirm("Quit this session? Your answered questions are already saved.")){ clearInterval(App.timer); renderHome(); } });

/* ===== FINISH + REPORT ===== */
function finish(){
  clearInterval(App.timer);
  const present=[...new Set(App.qs.map(q=>q.type))];
  let correct=0,ans=0; const bd={}; present.forEach(t=>bd[t]={c:0,t:0});
  App.qs.forEach(q=>{ const a=App.answers[q.id]; if(a!=null){ans++; const g=bd[q.type]; g.t++; if(a===q.correct_answer){correct++;g.c++;}} });
  const pct=ans?Math.round(100*correct/ans):0;
  const tVals=Object.values(App.qTimes); const avg=tVals.length?Math.round(tVals.reduce((a,b)=>a+b,0)/tVals.length):0;
  $("#repScore").innerHTML=pct+'<small>%</small>';
  $("#repSub").textContent=`${correct} correct of ${ans} answered · ${App.qs.length} in set${App.timed?` · total ${mmss(App.elapsed)}`:""}`;
  const cell=(l,s)=>`<div class="c"><div class="n">${s.t?Math.round(100*s.c/s.t):0}%</div><div class="l">${l} · ${s.c}/${s.t}</div></div>`;
  $("#repGrid").innerHTML=`<div class="c"><div class="n">${correct}/${App.qs.length}</div><div class="l">Overall</div></div>`+
    present.map(t=>cell(t,bd[t])).join("")+
    `<div class="c"><div class="n">${avg?mmss(avg):'—'}</div><div class="l">Avg / question</div></div>`;
  App._repExpl=false; $("#repExpl").textContent="Show all explanations"; buildRepList(); show("report");
}
function buildRepList(){

/* ===== DASHBOARD ===== */
function bar(name,a){ const pct=a&&a.t?Math.round(100*a.c/a.t):null;
  const col=pct==null?"var(--line)":pct>=75?"var(--green)":pct>=50?"var(--amber)":"var(--red)";
  return `<div class="barrow"><div class="nm" title="${esc(name)}">${esc(name)}</div>
    <div class="tr"><i style="width:${pct==null?0:pct}%;background:${col}"></i></div>
    <div class="vv">${a&&a.t?`${a.c}/${a.t}`:'—'}</div></div>`; }
function bardetail(sec){
  if(sec.k==="verbal"){
    const rcS=Store.byField("subtype","RC"), crS=Store.byField("subtype","CR");
    const rcC=Store.byField("chapter","RC"), crC=Store.byField("chapter","CR");
    const rc=Object.keys(rcS).length?rcS:rcC, cr=Object.keys(crS).length?crS:crC;
    const block=(lbl,agg)=>{ const ks=Object.keys(agg).sort((a,b)=>(agg[a].c/agg[a].t)-(agg[b].c/agg[b].t));
      return ks.length?`<div class="bd-lbl">${lbl} — weakest first</div>`+ks.map(k=>bar(k,agg[k])).join(""):""; };
    const out=block("Reading Comprehension",rc)+block("Critical Reasoning",cr);
    return out||`<div class="nodata">No Verbal attempts yet.</div>`;
  }
  const t=sec.types[0], agg=Store.byField("chapter",t);
  const ks=Object.keys(agg).sort((a,b)=>(agg[a].c/agg[a].t)-(agg[b].c/agg[b].t));
  return ks.length?`<div class="bd-lbl">By topic — weakest first</div>`+ks.map(k=>bar(k,agg[k])).join(""):`<div class="nodata">No attempts yet.</div>`;
}

  const cards=secs.map(s=>{ const st=secStat(s.types);
    return `<div class="scard"><div class="sc-h"><span class="sc-ic">${s.ic}</span><b>${s.label}</b>
      <span class="sc-pct">${st.pct==null?'—':st.pct+'%'}</span></div>

      ${bardetail(s)}</div>`; }).join("");
  $("#dashWrap").innerHTML=`
    <div class="pagehead"><div class="kick">Dashboard</div><h2>Your performance</h2>
      <p>Precision and weak spots — overall and by section.</p></div>
    <div class="dhero">
      <div class="ringbox"><svg width="66" height="66" viewBox="0 0 66 66" aria-hidden="true">
        <circle cx="33" cy="33" r="28" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="7"/>
        <circle cx="33" cy="33" r="28" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"
          stroke-dasharray="${C}" stroke-dashoffset="${ov.pct==null?C:C-C*ov.pct/100}" transform="rotate(-90 33 33)" style="transition:stroke-dashoffset .8s"/></svg>
        <div><div class="pc">${ov.pct==null?'—':ov.pct+'%'}</div><div class="subt">${ov.seen?`${ov.corr}/${ov.seen} correct`:'no attempts yet'}</div></div></div>
      <div class="quick">
        <div class="q"><div class="n">${ov.seen}</div><div class="l">Done</div></div>
        <div class="q"><div class="n">${ov.corr}</div><div class="l">Correct</div></div>
        <div class="q"><div class="n">${wrong}</div><div class="l">To redo</div></div></div>
    </div>
    <h3 class="sec">By section</h3>
    <div class="scards">${cards}</div>
    <div class="callout" style="margin-top:16px">${dashInsight(ov)}</div>
    <p class="foot">Overall precision <b>${ov.pct==null?'—':ov.pct+'%'}</b> across ${ov.seen} question${ov.seen===1?"":"s"}.
      Progress is saved on this device — export or reset it in Settings.</p>`;
  show("dash");
}
function dashInsight(ov){
  if(!ov.seen) return "💡 Answer a few questions and this space highlights your weakest topic and precision.";
  /* find single weakest concept with enough attempts, across all types */
  let best=null;
  for(const field of ["subtype","chapter"]){
    const agg=Store.byField(field);
    for(const [name,a] of Object.entries(agg)){ if(a.t<MIN_ATTEMPTS)continue; const p=a.c/a.t; if(!best||p<best.p)best={name,a,p}; }
  }
  if(!best) return `You're at <b>${ov.pct}%</b> precision over ${ov.seen} questions. Keep going to unlock weak-spot targeting (needs ${MIN_ATTEMPTS}+ tries per topic).`;
  return `🎯 <b>Focus area:</b> your weakest subchapter is <b>${esc(best.name)}</b> (${best.a.c}/${best.a.t}, ${Math.round(100*best.p)}%). Open that section → <b>By subchapter</b> to drill it.`;
}

/* ===== VECTOR SEARCH — runs FULLY IN THE BROWSER (no backend) =====
   Precomputed, L2-normalized question vectors ship in embeddings.json, so cosine
   similarity is just a dot product in JS. The query is embedded on-device with
   transformers.js (all-MiniLM-L6-v2, the same model used offline) — loaded lazily
   and cached by the browser after first use. This is what makes Smart search and
   the similar-questions panel work on a static host like Vercel. */
const EMB=new Map(); let _embReady=false, _embLoading=null;
async function loadEmbeddings(){
  if(_embReady) return true;
  if(_embLoading) return _embLoading;
  _embLoading=(async()=>{
    for(const q of App.all){ if(Array.isArray(q.embedding)&&!EMB.has(q.id)) EMB.set(q.id,Float32Array.from(q.embedding)); }
    try{ const r=await fetch("embeddings.json",{cache:"force-cache"});
      if(r.ok){ const j=await r.json(); for(const id in j){ if(!EMB.has(id)) EMB.set(id,Float32Array.from(j[id])); } } }catch(e){}
    _embReady=EMB.size>0; return _embReady;
  })();
  return _embLoading;
}
function cosine(a,b){ let s=0; for(let i=0,n=a.length;i<n;i++) s+=a[i]*b[i]; return s; }
function vecSimilar(id,limit){ const e=EMB.get(id); if(!e) return [];
  const out=[]; for(const q of App.all){ if(q.id===id) continue; const v=EMB.get(q.id); if(!v) continue; out.push({q,score:cosine(e,v)}); }
  out.sort((a,b)=>b.score-a.score); return out.slice(0,limit); }
function vecSearch(qv,limit){ const out=[];
  for(const q of App.all){ const v=EMB.get(q.id); if(!v) continue; out.push({q,score:cosine(qv,v)}); }
  out.sort((a,b)=>b.score-a.score); return out.slice(0,limit); }
/* in-browser query embedding via transformers.js (lazy import, browser-cached model) */
let _extractor=null,_extractorLoading=null;
async function getExtractor(onstart){
  if(_extractor) return _extractor;
  if(!_extractorLoading){ if(onstart) onstart();
    _extractorLoading=(async()=>{
      const mod=await import("https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2");
      mod.env.allowLocalModels=false; mod.env.useBrowserCache=true;
      _extractor=await mod.pipeline("feature-extraction","Xenova/all-MiniLM-L6-v2");
      return _extractor;
    })();
  }
  return _extractorLoading;
}
async function embedQuery(text,onstart){ const ex=await getExtractor(onstart);
  const out=await ex(text,{pooling:"mean",normalize:true}); return Float32Array.from(out.data); }

function renderSimilarPanel(results){
  if(!results||!results.length) return "";
  const items=results.map(r=>{
    const q=App.all.find(x=>x.id===r.question_id);
    const stem=(q?q.question.split("\n\n").pop():(r.stem||"")).slice(0,120);
    const pctm=Math.round((r.score||0)*100);
    return `<div class="sim-item" data-id="${esc(r.question_id)}"><div style="flex:1;min-width:0">
        <div class="si-meta"><span class="pill">${esc(r.type||"")}</span>${r.difficulty?`<span class="pill d-${r.difficulty}">${esc(r.difficulty)}</span>`:""}${r.subtype?`<span class="pill" style="opacity:.7">${esc(r.subtype)}</span>`:(r.chapter?`<span class="pill" style="opacity:.7">${esc(r.chapter)}</span>`:"")}</div>
        <div class="si-text">${esc(stem)}${stem.length>=120?"&hellip;":""}</div>
      </div><span class="si-match"><span class="mp">${pctm}%</span><span class="mbar"><i style="width:${pctm}%"></i></span></span></div>`;
  }).join("");
  return `<div class="sim-panel"><div class="sh"><span class="dot"></span>Similar questions<span class="sp">✦ AI-matched</span></div><div class="sim-list">${items}</div></div>`;
}
async function showSimilarForCurrentQ(){
  const q=App.qs[App.idx]; const slot=document.getElementById("simPanelSlot");
  if(!slot||!q) return;
  await loadEmbeddings();
  const sims=vecSimilar(q.id,3);
  if(!sims.length) return;
  const results=sims.map(({q,score})=>({question_id:q.id,type:q.type,difficulty:q.difficulty,subtype:q.subtype,chapter:q.chapter,score,stem:q.question.split("\n\n").pop()}));
  slot.innerHTML=renderSimilarPanel(results);
  slot.querySelectorAll(".sim-item").forEach(el=>el.addEventListener("click",()=>{
    const qi=App.qs.findIndex(x=>x.id===el.dataset.id);
    if(qi>=0){ if(qi!==App.idx){ App.idx=qi; renderQ(); } return; }
    const found=App.all.find(x=>x.id===el.dataset.id);
    if(!found) return;
    /* Open it as part of this session: APPEND (never insert mid-array — answers,
       checked and qTimes are keyed by index) and jump straight to it. */
    App.qs.push(found);
    App.idx=App.qs.length-1;
    renderQ();
  }));
}
let _srchTimer=null;
async function doSearch(query){
  const el=$("#srchResults"),st=$("#srchStatus");
  if(!query||query.length<3){ el.classList.add("hidden"); el.innerHTML=""; st.classList.add("hidden"); return; }
  await loadEmbeddings();
  if(!EMB.size){ st.textContent="Search index is still loading — try again in a moment."; st.classList.remove("hidden"); el.classList.add("hidden"); return; }
  st.classList.remove("hidden");
  st.textContent=_extractor?"Searching…":"Warming up the search model (first time only)…";
  const stamp=query;
  try{
    const qv=await embedQuery(query,()=>{ st.textContent="Warming up the search model (first time only)…"; });
    if($("#srchInput").value.trim()!==stamp) return; // superseded by newer keystrokes
    const res=vecSearch(qv,8);
    el.innerHTML=!res.length?`<div class="sr-empty">No matches for "${esc(query)}"</div>`
      :res.map(({q,score})=>{ const stem=q.question.split("\n\n").pop().slice(0,120); const tag=q.subtype||q.chapter;
          return `<div class="sr-item" data-id="${esc(q.id)}">
            <div class="sr-meta"><span class="pill">${esc(q.type||"")}</span>${q.difficulty?`<span class="pill d-${q.difficulty}">${esc(q.difficulty)}</span>`:""}${tag?`<span class="pill" style="opacity:.7">${esc(tag)}</span>`:""}
              <span style="color:var(--faint);font-size:11px">${Math.round(score*100)}% match</span></div>
            <div class="sr-text">${esc(stem)}${stem.length>=120?"&hellip;":""}</div></div>`; }).join("");
    el.classList.remove("hidden");
    st.textContent=`${res.length} result${res.length!==1?"s":""} for "${query}"`;
  }catch(e){ console.warn("[search]",e); el.classList.add("hidden");
    st.textContent="Couldn't load the on-device search model — check your connection and retry."; }
}
$("#srchInput").addEventListener("input",e=>{ clearTimeout(_srchTimer); _srchTimer=setTimeout(()=>doSearch(e.target.value.trim()),400); });
$("#srchResults").addEventListener("click",e=>{ const item=e.target.closest(".sr-item"); if(!item) return;
  const q=App.all.find(x=>x.id===item.dataset.id); if(!q) return;
  App.mode="practice"; App.timed=false; App._sessMeta={title:"Search result"}; App.qs=[q]; resetRun(); startRun();
});

applyTheme(document.documentElement.getAttribute("data-theme")==="dark"?"dark":"light");

(async()=>{ await loadAll(); loadEmbeddings(); renderLanding(); Sync.init(); Attempts.init(); })();
