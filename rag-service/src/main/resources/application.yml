server:
  port: ${RAG_PORT:8081}
spring:
  application:
    name: gmat-rag-service
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${RAG_DB_POOL_SIZE:3}
      minimum-idle: ${RAG_DB_MIN_IDLE:1}
      connection-timeout: 10000
app:
  internal-token: ${RAG_INTERNAL_TOKEN:local-development-only-change-me}
  retrieval:
    candidates: ${RAG_CANDIDATES:20}
    limit: ${RAG_CONTEXT_LIMIT:5}
    minimum-score: ${RAG_MINIMUM_SCORE:0.28}
  provider:
    base-url: ${TUTOR_BASE_URL:https://integrate.api.nvidia.com/v1}
    api-key: ${NVIDIA_API_KEY:}
    model: ${NVIDIA_MODEL:nvidia/nemotron-3-ultra-550b-a55b}
