server:
  port: ${PORT:${PROGRESS_PORT:8082}}
  shutdown: graceful
spring:
  application:
    name: gmat-progress-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${PROGRESS_DB_POOL_SIZE:3}
      minimum-idle: ${PROGRESS_DB_MIN_IDLE:1}
      connection-timeout: 10000
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
app:
  internal-token: ${PROGRESS_INTERNAL_TOKEN:local-development-only-change-me}
  outbox:
    poll-delay-ms: ${OUTBOX_POLL_DELAY_MS:500}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
